<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Sanket — Voice Distress-Risk Detection</title>
    <meta
      name="description"
      content="Sanket is a multimodal voice distress-risk detection system that estimates potential distress through non-verbal acoustic and conversational pattern analysis."
    />
    <meta name="theme-color" content="#f9fdff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c1415" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved theme before first paint (no light/dark flash)
      (function () {
        try {
          var t = localStorage.getItem('sanket-theme') || 'system';
          var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
